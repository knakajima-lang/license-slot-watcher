name: 学科試験 空き枠ウォッチ

on:
  schedule:
    - cron: "*/10 * * * *"   # 約10分おき（GitHubの混雑で数分遅れることがあります）
  workflow_dispatch:
    inputs:
      test:
        description: "テスト通知を送る"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write   # 60日で自動停止されないよう、ワークフローを有効化し直すため

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 前回の状態を復元
        uses: actions/cache/restore@v4
        with:
          path: state
          key: slot-state-${{ github.run_id }}
          restore-keys: slot-state-

      - name: 空き枠チェック
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          COURSE_CODE: ${{ vars.COURSE_CODE || '11' }}
          PLACE_CODES: ${{ vars.PLACE_CODES || '270,280,250' }}
          MONTHS: ${{ vars.MONTHS }}   # 空なら「今月〜約3か月先」を自動で見張る
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test }}" = "true" ]; then
            python3 monitor.py --test
          else
            python3 monitor.py
          fi

      - name: 自動停止の防止（1日1回）
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 60日間更新がないリポジトリは定期実行が止まるため、毎日0時台に有効化し直す
          if [ "$(TZ=Asia/Tokyo date +%H)" = "00" ] && [ "$(date +%M)" -lt 10 ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watch.yml/enable" && echo "keepalive OK"
          fi

      - name: 状態を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: slot-state-${{ github.run_id }}
